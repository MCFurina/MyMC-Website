<!DOCTYPE html>
<html lang="zh" style="scroll-behavior: smooth">
<head>
    <title>MyMC | Minecraft服务器</title>
    <link rel="icon" href="Assets/MyMC_64.png">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background-color: #000000; margin: 0; padding: 0; background-image: url(Assets/background.png); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed">
    <nav style="display: flex; flex-direction: row; text-align: center; align-items: center; background-color: rgba(255, 255, 255, 0.4); padding: 10px; margin: 0 auto; border-radius: 8px; max-width: 1600px; position: fixed; top: 0; left: 0; right: 0; z-index: 9999; backdrop-filter: blur(5px)">
        <a href="./" style="text-decoration: none; font-weight: bold; color: inherit; font-size: 24px">
            <div>
                <img src="Assets/MyMC_64.png" style="vertical-align: middle" alt="MyMC Icon" width="64" height="64" />
                MyMC
            </div>
        </a>
        <div style="position: absolute; left: 50%; transform: translateX(-50%); flex-direction: row; gap: 20px" class="nav-items">
            <a style="text-decoration: none; color: inherit; font-size: 20px; border-radius: 8px; transition: background-color 0.2s ease; background-color: rgba(255, 255, 255, 0.8); padding: 5px">
                主页
            </a>
            <a style="text-decoration: none; color: inherit; font-size: 20px; border-radius: 8px; transition: background-color 0.2s ease; padding: 5px" href="./Gallery/" class="nav-item">
                画廊
            </a>
        </div>
        <label style="margin-left: auto" class="nav-menu">
            <select onchange="window.location.href=this.value">
                <option value="">选择页面</option>
                <option value="./">首页</option>
                <option value="./Gallery/">画廊</option>
            </select>
        </label>
    </nav>
    <div style="align-items: center; text-align: center; margin-top: 150px">
        <div style="font-size: 60px; color: white">MyMC | 我们的世界</div>
        <div style="font-size: 50px; color: white; margin-top: 30px">一个纯净的Minecraft生存服务器</div>
        <div style="color: white; font-size: 40px; margin-top: 30px">支持Java/基岩版</div>
    </div>
    <div style="display: flex; flex-direction: row; margin-top: 20px; justify-content: center; gap: 20px">
        <a class="btn" href="./Gallery/">前往画廊</a>
    </div>
    <div style="margin-top: 70px" class="center-card">
        <a style="color: white; font-size: 30px; margin-right: auto">服务器状态：</a><br>
        <img style="margin-top: 20px; max-width: 100%; height: auto" src="https://motd.puddingkc.com/status.png?ip=mymcland.top&style=style5&language=zh" alt="MyMC Status" width="900" height="130"/>
    </div>
    <div style="margin-top: 70px" class="center-card">
        <div style="color: white; font-size: 30px; margin-right: auto">IP地址：</div>
        <div style="color: white; font-size: 25px; margin-top: 20px">Java版</div>
        <div style="color: white; font-size: 25px; margin-top: 10px">mymcland.top<a href="#" onclick="copyJavaIP(this); return false;" class="btn" style="padding: 5px; color: black; margin-left: 5px">复制</a></div>
        <div style="color: white; font-size: 25px; margin-top: 20px">基岩版</div>
        <div style="color: white; font-size: 25px; margin-top: 10px">be.mymcland.top<a href="#" onclick="copyBedrockIP(this); return false;" class="btn" style="padding: 5px; color: black; margin-left: 5px">复制</a></div>
        <div style="color: white; font-size: 25px; margin-top: 10px">端口 40016<a href="#" onclick="copyBedrockPort(this); return false;" class="btn" style="padding: 5px; color: black; margin-left: 5px">复制</a></div>
    </div>
    <div style="margin-top: 70px" class="center-card">
        <div style="color: white; font-size: 30px; margin-right: auto; margin-bottom: 20px">玩家社区：</div>
        <a href="https://qm.qq.com/q/Btq5z1WSHu" target="_blank" class="btn">
            加入QQ群
        </a>
    </div>
    <footer style="margin-top: 500px; max-width: 1600px; height: 100px; margin-left: auto; margin-right: auto; display: flex; flex-direction: row; gap: 20px; text-align: center; align-items: center; background-color: rgba(255, 255, 255, 0.4); padding: 0 10px; border-radius: 8px; backdrop-filter: blur(5px)">
        <a style="font-size: 30px">
            MyMC
        </a>
        <a style="margin-left: auto">
            ©MyMC Server 2026 版权所有
        </a>
    </footer>
</body>
</html>
<script>
    function copyJavaIP(btn) {

        const textToCopy = "mymcland.top";
        const originalText = btn.textContent;

        navigator.clipboard.writeText(textToCopy).then(() => {
            btn.textContent = "复制成功"
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        }).catch(() => {
            btn.textContent = "复制失败"
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        });
    }
    function copyBedrockIP(btn) {

        const textToCopy = "be.mymcland.top";
        const originalText = btn.textContent;

        navigator.clipboard.writeText(textToCopy).then(() => {
            btn.textContent = "复制成功"
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        }).catch(() => {
            btn.textContent = "复制失败"
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        });
    }
    function copyBedrockPort(btn) {

        const textToCopy = "40016";
        const originalText = btn.textContent;

        navigator.clipboard.writeText(textToCopy).then(() => {
            btn.textContent = "复制成功"
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        }).catch(() => {
            btn.textContent = "复制失败"
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        });
    }
</script>
