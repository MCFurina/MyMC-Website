<!DOCTYPE html>
<html lang="zh" style="scroll-behavior: smooth">
<head>
    <title>MyMC | Minecraft服务器</title>
    <link rel="icon" href="Assets/MyMC_64.png">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background-color: #000000; margin: 0; padding: 0; background-image: url(Assets/background.png); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed">
    <nav style="display: flex; flex-direction: row; text-align: center; align-items: center; background-color: rgba(255, 255, 255, 0.4); padding: 10px; margin: 0 auto; border-radius: 8px; max-width: 1600px; position: fixed; top: 0; left: 0; right: 0; z-index: 9999; backdrop-filter: blur(5px)">
        <a href="./" style="text-decoration: none; font-weight: bold; color: inherit; font-size: 24px">
            <div>
                <img src="Assets/MyMC_64.png" style="vertical-align: middle" alt="MyMC Icon" width="64" height="64" />
                MyMC
            </div>
        </a>
        <div style="position: absolute; left: 50%; transform: translateX(-50%); flex-direction: row; gap: 20px" class="nav-items">
            <a href="./" class="nav-item nav-item-selected">
                主页
            </a>
            <a href="./Gallery/" class="nav-item">
                画廊
            </a>
            <a href="https://docs.qq.com/aio/DS3Rvb0lQZVpRVXB5" target="_blank" class="nav-item">
                文档
                <svg class="external-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                    <path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3z"/>
                    <path d="M5 5h6v2H7v10h10v-4h2v6H5V5z"/>
                </svg>
            </a>
        </div>
        <details class="nav-menu" style="margin-left: auto; position: relative;">
            <summary style="list-style: none; cursor: pointer; user-select: none;" class="btn">选择页面</summary>
            <div style="position: absolute; top: 100%; right: 0; min-width: 140px; background: rgba(255, 192, 203, 1.0); border: solid 1px white; border-radius: 8px; padding: 10px; z-index: 10000; display: flex; flex-direction: column; gap: 10px;">
                <a href="./" class="nav-item nav-item-selected">
                    主页
                </a>
                <a href="./Gallery/" class="nav-item">
                    画廊
                </a>
                <a href="https://docs.qq.com/aio/DS3Rvb0lQZVpRVXB5" target="_blank" class="nav-item">
                    文档
                    <svg class="external-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                        <path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3z"/>
                        <path d="M5 5h6v2H7v10h10v-4h2v6H5V5z"/>
                    </svg>
                </a>
            </div>
        </details>
    </nav>
    <div style="align-items: center; text-align: center; margin-top: 200px">
        <div style="color: pink" class="title-text">MyMC</div>
        <div style="margin-top: 40px;" class="subtitle-text gradient-text-1">一个纯净的Minecraft生存服务器</div>
    </div>
    <div style="display: flex; flex-direction: row; margin-top: 50px; justify-content: center; gap: 25px; flex-wrap: wrap;">
        <a class="btn" href="#community">加入社区</a>
        <a class="btn" href="#ip">IP地址</a>
    </div>
    <div style="margin-top: 70px" class="center-card">
        <a style="color: white; font-size: 30px; margin-right: auto">服务器状态</a>
        <a style="color: white; font-size: 25px; margin-top: 10px">状态：<span id="onlineStatus">--</span></a>
        <a style="color: white; font-size: 25px">在线人数：<span id="onlinePlayers">--</span> / <span id="maxPlayers">--</span></a>
    </div>
    <div style="margin-top: 70px" class="center-card" id="ip">
        <div style="color: white; font-size: 30px; margin-right: auto">IP地址</div>
        <div style="color: white; font-size: 25px; margin-top: 20px">Java版</div>
        <div style="color: white; font-size: 25px; margin-top: 10px">mymcland.top<button onclick="copyButton(this, 'mymcland.top')" class="btn" style="padding: 5px; color: black; margin-left: 5px">复制</button></div>
        <div style="color: white; font-size: 25px; margin-top: 20px">基岩版</div>
        <div style="color: white; font-size: 25px; margin-top: 10px">be.mymcland.top<button onclick="copyButton(this, 'be.mymcland.top')" class="btn" style="padding: 5px; color: black; margin-left: 5px">复制</button></div>
        <div style="color: white; font-size: 25px; margin-top: 10px">端口 40016<button onclick="copyButton(this, '40016')" class="btn" style="padding: 5px; color: black; margin-left: 5px">复制</button></div>
    </div>
    <div style="margin-top: 70px" class="center-card" id="community">
        <div style="color: white; font-size: 30px; margin-right: auto; margin-bottom: 20px">玩家社区</div>
        <a href="https://qm.qq.com/q/Btq5z1WSHu" target="_blank" class="btn">
            加入QQ群
        </a>
    </div>
    <footer style="margin-top: 100px; margin-left: auto; margin-right: auto; display: flex; flex-direction: column; gap: 20px; text-align: center; align-items: center; background-color: rgba(255, 255, 255, 0.4); padding: 20px 10px; backdrop-filter: blur(5px)">
        <div style="display: flex; flex-direction: row; flex-wrap: wrap; gap: 50px;">
            <div style="display: flex; flex-direction: column; gap: 10px; text-align: left;">
                <a style="font-size: 20px; font-weight: bold;">
                    <img src="./Assets/MyMC_64.png" alt="MyMC Icon" style="width: 32px; height: 32px; vertical-align: middle;" />
                    MyMC
                </a>
                <a style="font-size: 16px">
                    一个纯净的Minecraft生存服务器
                </a>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px; text-align: left;">
                <a style="margin-bottom: 10px; font-weight: bold;">更多</a>
                <a class="linktext" href="https://docs.qq.com/aio/DS3Rvb0lQZVpRVXB5" target="_blank">
                    文档
                </a>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px; text-align: left;">
                <a style="margin-bottom: 10px; font-weight: bold;">社区</a>
                <a class="linktext" href="https://github.com/MCFurina/MyMC-Website" target="_blank">
                    GitHub
                </a>
                <a class="linktext" href="https://qm.qq.com/q/Btq5z1WSHu" target="_blank">
                    QQ群
                </a>
            </div>
        </div>
        <hr style="width: 80%; max-width: 1600px; border: 1px solid rgba(255, 255, 255, 0.5)" />
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <a style="font-size: 16px">
                社区服务器。Minecraft是Mojang Studios的注册商标，本网站和介绍的服务器与Mojang Studios和Microsoft均无关联
            </a>
            <a style="font-size: 16px">
                © 2026 MyMC服务器 版权所有
            </a>
        </div>
    </footer>
</body>
</html>
<script src="./homepage.js"></script>
